description: 3D-printable antenna cap for the Mazda MX-5 Miata (NC) (2006–2015). Print it yourself or take the file to a local print shop. Plugs the hole left when the factory antenna is removed. Designed on an NC; it will likely fit other Mazdas with the same antenna base, but that is not confirmed. The download is a ZIP with one STL file (Miata_Antenna_Plug.stl) exactly as the designer published them, plus the license and attribution. Designed by BradK91 and shared under CC BY 4.0. Compare the part with your original before installing, since cars of the same model can differ by year and market.
