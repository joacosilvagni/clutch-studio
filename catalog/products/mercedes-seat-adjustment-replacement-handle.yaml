description: 3D-printable seat adjustment handle for the Mercedes-Benz W123 (1976–1986) and Mercedes-Benz W116 (S-Class) (1972–1980). Print it yourself or take the file to a local print shop. Works for all four seat adjuster handles. The side height adjusters take one screw, the front ones take two. The download is a ZIP with one STL file (Mercedes_w123_seat_handle.stl) exactly as the designer published them, plus the license and attribution. Designed by TrustDavid and shared under CC BY 4.0. Compare the part with your original before installing, since cars of the same model can differ by year and market.
