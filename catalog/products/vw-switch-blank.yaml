summary: Switch blank for the Volkswagen Golf / Rabbit Mk1 (1974–1983), Volkswagen Jetta Mk1 (1979–1984) and 2 more. Print-ready STL, instant download.
description: 3D-printable switch blank for the Volkswagen Golf / Rabbit Mk1 (1974–1983), Volkswagen Jetta Mk1 (1979–1984), Volkswagen Passat B1 / Dasher (1973–1980) and Volkswagen LT Mk1 (1975–1996). Print it yourself or take the file to a local print shop. Later flat version, VW 861957087. The earlier domed blank (321957087) has the same dimensions. The download is a ZIP with one STL file (Blank.stl) exactly as the designer published them, plus the license and attribution. Designed by redi3001 and shared under CC BY-SA 4.0. Compare the part with your original before installing, since cars of the same model can differ by year and market.
