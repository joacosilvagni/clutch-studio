summary: Cupholder for the Jeep Cherokee XJ (1984–1995). Print-ready STL, instant download.
description: 3D-printable cupholder for the Jeep Cherokee XJ (1984–1995). Print it yourself or take the file to a local print shop. Made to fit over the handbrake of a 1993 right-hand-drive XJ. The lever position varies between cars, so compare it with the dimensions in the files before printing. The download is a ZIP with one STL file (cupHolder.stl) exactly as the designer published them, plus the license and attribution. Designed by putridp and shared under CC BY-SA 4.0. Compare the part with your original before installing, since cars of the same model can differ by year and market.
