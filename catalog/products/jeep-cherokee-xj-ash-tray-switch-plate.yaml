description: 3D-printable ash tray switch plate for the Jeep Cherokee XJ (1997–2001). Print it yourself or take the file to a local print shop. Made on a 2000 XJ, for the 1997–2001 dash. The download is a ZIP with 3 STL files (SwitchHolder_5hole_v3.stl, SwitchHolder_blank_v3.stl, SwitchHolder_blank_v3_w_logo.stl) exactly as the designer published them, plus the license and attribution. Designed by sixty7ss and shared under CC BY 4.0. Compare the part with your original before installing, since cars of the same model can differ by year and market.
