description: 3D-printable pod filter adaptor for the BMW E30 (1982–1994) and BMW E36 (1990–2000). Print it yourself or take the file to a local print shop. Only for the M40 or M42 four-cylinder engine. The download is a ZIP with one STL file (Air_filter_bracket_v2.stl) exactly as the designer published them, plus the license and attribution. Designed by zakary50 and shared under CC BY-SA 4.0. Compare the part with your original before installing, since cars of the same model can differ by year and market.
