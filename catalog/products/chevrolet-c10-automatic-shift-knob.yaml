description: 3D-printable automatic shift knob for the Chevrolet C10 / C/K pickup (1978). Print it yourself or take the file to a local print shop. Designed on a 1978 C10 with an automatic. It may fit other years, but the designer has not tested them. The download is a ZIP with one STL file (c10_shift_knob.STL) exactly as the designer published them, plus the license and attribution. Designed by KCP and shared under CC BY 4.0. The designer notes the part had not been test-fitted when it was published, so compare it with your original before installing.
