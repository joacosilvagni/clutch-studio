description: 3D-printable clutch tool for the Volkswagen Beetle (Type 1) (1938–2003) and Volkswagen Bus T1/T2 (Type 2) (1950–1979). Print it yourself or take the file to a local print shop. Clutch alignment tool for engines up to 1600 cc. The download is a ZIP with one STL file (T1_Clutch_tool_-1600.stl) exactly as the designer published them, plus the license and attribution. Designed by Tobes49 and shared under CC BY 4.0. Compare the part with your original before installing, since cars of the same model can differ by year and market.
