summary: Speedometer mounting bezel for the Volkswagen Beetle (Type 1) (1938–2003) and Volkswagen Super Beetle (flat windshield) (1971–1972). Print-ready STL, instant download.
description: 3D-printable speedometer mounting bezel for the Volkswagen Beetle (Type 1) (1938–2003) and Volkswagen Super Beetle (flat windshield) (1971–1972). Print it yourself or take the file to a local print shop. Mounts a universal digital motorcycle speedometer. Not for the curved-dash 1973 and later Super Beetle. The download is a ZIP with one STL file (Speedometer_Bezel_v1.stl) exactly as the designer published them, plus the license and attribution. Designed by cjmck422 and shared under CC BY 4.0. Compare the part with your original before installing, since cars of the same model can differ by year and market.
