summary: Engine cover cap for the BMW 5 Series (E34) (1988–1996), BMW E36 (1990–2000) and 4 more. Print-ready STL, instant download.
description: 3D-printable engine cover cap for the BMW 5 Series (E34) (1988–1996), BMW E36 (1990–2000), BMW 7 Series (E38) (1994–2001), BMW 5 Series (E39) (1995–2004), BMW 3 Series (E46) (1997–2006) and BMW 5 Series (E60) (2003–2010). Print it yourself or take the file to a local print shop. Only for cars with the M50, M52 or M54 six-cylinder engine (any displacement). Replaces engine cover cap 11121726089. The download is a ZIP with one STL file (M50-M52-M54-Engine-Cover-Cap.stl) exactly as the designer published them, plus the license and attribution. Designed by cerberusenator and shared under CC BY 4.0. Compare the part with your original before installing, since cars of the same model can differ by year and market.
