description: 3D-printable cable holder for the BMW E30 (1982–1994) and BMW E36 (1990–2000). Print it yourself or take the file to a local print shop. Replaces BMW clip 61131267476, used on many older and newer BMW models. If your car uses that part number, this fits. The download is a ZIP with one STL file (BMW_61131267476.stl) exactly as the designer published them, plus the license and attribution. Designed by jdance24 and shared under CC BY 4.0. Compare the part with your original before installing, since cars of the same model can differ by year and market.
