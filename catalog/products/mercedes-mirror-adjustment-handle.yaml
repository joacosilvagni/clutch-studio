description: 3D-printable mirror adjustment handle for the Mercedes-Benz W124 (E-Class) (1984–1997), Mercedes-Benz W123 (1976–1986), Mercedes-Benz W201 (190 / 190E) (1982–1993) and Mercedes-Benz W126 (S-Class) (1979–1991). Print it yourself or take the file to a local print shop. Driver-side mirror adjuster. Made for a 5 mm rod. The download is a ZIP with 2 STL files (handle.stl, lock.stl) exactly as the designer published them, plus the license and attribution. Designed by WvdbID and shared under CC BY 4.0. Compare the part with your original before installing, since cars of the same model can differ by year and market.
