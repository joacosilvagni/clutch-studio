summary: Cupholder for the Volkswagen Golf Mk3 (1991–1999). Print-ready STL files, instant download.
description: 3D-printable cupholder for the Volkswagen Golf Mk3 (1991–1999). Print it yourself or take the file to a local print shop. Hangs from the front of the ashtray. It partly covers the switch row above it (the V4 file covers it fully). The download is a ZIP with 3 STL files (Mk3_cupholderV2.stl, Mk3_cupholderV3_tight_fit_cans.stl, Mk3_cupholderV4_moved_to_passenger_side_tight_fit_cans.stl) exactly as the designer published them, plus the license and attribution. Designed by lauritz221 and shared under CC BY-SA 4.0. Compare the part with your original before installing, since cars of the same model can differ by year and market.
