summary: Steering column bushing for the Saab 900 (classic) (1990–1994) and Saab 9000 (1986–1998). Print-ready STL files, instant download.
description: "3D-printable steering column bushing for the Saab 900 (classic) (1990–1994) and Saab 9000 (1986–1998). Print it yourself or take the file to a local print shop. Three inner diameters included: 20 mm (original), 20.5 mm and 21 mm. The download is a ZIP with 3 STL files (saab_steering_bushing.STL, saab_steering_bushing_ID+.5mm.STL, saab_steering_bushing_ID+1mm.STL) exactly as the designer published them, plus the license and attribution. Designed by bob24r and shared under CC BY-SA 4.0. Compare the part with your original before installing, since cars of the same model can differ by year and market."
