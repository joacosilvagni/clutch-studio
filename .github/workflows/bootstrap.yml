name: Bootstrap Cloudflare
# Run once from the Actions tab: creates the D1 database and the PRIVATE R2 bucket, applies migrations.
# Needs secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Safe to re-run (existing resources are kept).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - name: Create D1 database (if missing)
        run: |
          if npx wrangler d1 list --json | jq -e '.[] | select(.name == "clutch-studio")' > /dev/null; then
            echo "D1 clutch-studio already exists"
          else
            npx wrangler d1 create clutch-studio
          fi
      - name: Create private R2 bucket (if missing)
        run: |
          if npx wrangler r2 bucket list | grep -q 'clutch-studio-files'; then
            echo "R2 bucket already exists"
          else
            npx wrangler r2 bucket create clutch-studio-files
          fi
      - name: Point wrangler.jsonc at the real D1 id
        run: ../.github/scripts/set-d1-id.sh
      - name: Apply migrations
        run: npx wrangler d1 migrations apply clutch-studio --remote
