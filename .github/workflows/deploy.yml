name: Deploy
# Deploys site + Worker to Cloudflare on every push to main.
# Disabled until the repo variable DEPLOY_ENABLED is "true" and these secrets exist:
#   CLOUDFLARE_API_TOKEN (scoped: Workers Scripts edit, D1 edit, R2 edit on this account only)
#   CLOUDFLARE_ACCOUNT_ID
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run catalog:build
      - run: npm test
      - name: Build site
        working-directory: site
        run: npm ci && npm run build
      - name: Configure, migrate, deploy and sync secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_WEBHOOK_ID: ${{ secrets.PAYPAL_WEBHOOK_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          ../.github/scripts/set-d1-id.sh
          npx wrangler d1 migrations apply clutch-studio --remote
          npx wrangler deploy
          # Push only the secrets that exist in GitHub; values never touch the repo or the logs.
          jq -n 'env | {PAYPAL_CLIENT_SECRET, PAYPAL_WEBHOOK_ID, RESEND_API_KEY} | with_entries(select(.value != null and .value != ""))' > /tmp/secrets.json
          if [ "$(jq 'length' /tmp/secrets.json)" -gt 0 ]; then npx wrangler secret bulk /tmp/secrets.json; fi
          rm -f /tmp/secrets.json
